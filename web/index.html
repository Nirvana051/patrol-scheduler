<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡检调度台</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f5eff'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span><div><div class="brand-name">巡检调度台</div><div class="brand-sub">certaintyX 机器狗</div></div></div>
    <nav class="nav">
      <a href="#/dashboard" data-route="dashboard"><span class="ico">◉</span>总览</a>
      <a href="#/map" data-route="map"><span class="ico">⌖</span>地图与导航航点</a>
      <a href="#/waypoints" data-route="waypoints"><span class="ico">⚑</span>任务航点</a>
      <a href="#/tasks" data-route="tasks"><span class="ico">☰</span>任务规划</a>
      <a href="#/runs" data-route="runs"><span class="ico">▶</span>执行监控</a>
      <a href="#/events" data-route="events"><span class="ico">≡</span>任务事件</a>
      <a href="#/settings" data-route="settings"><span class="ico">⚙</span>设置</a>
    </nav>
    <div class="sidebar-foot">
      <div id="mode-badge" class="mode-badge">…</div>
      <div id="conn-state" class="conn-state">连接中…</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="lights" id="lights">
        <span class="light" data-k="online"><i></i>在线</span>
        <span class="light" data-k="lease"><i></i>控制权</span>
        <span class="light" data-k="estop"><i></i>急停</span>
        <span class="light" data-k="loc"><i></i>定位</span>
        <span class="light" data-k="task"><i></i>云端任务</span>
      </div>
      <div class="topbar-mid" id="topbar-pos">—</div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-sound" title="浏览器播报开关">🔊 声音</button>
        <button class="btn btn-warn" id="btn-stoptask" title="停止云端当前任务（不停设备）">■ 停任务</button>
        <button class="btn btn-danger" id="btn-estop">⚠ 急停</button>
        <button class="btn btn-ok hidden" id="btn-estop-clear">取消急停</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<div id="modals"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
